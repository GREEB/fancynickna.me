<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>fancynickna.me — fancy nickname generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
:root {
  --accent: #C8FF3D;
  --bg: #F5F2EA;
  --fg: #0E0E10;
  --fg-soft: rgba(14,14,16,0.62);
  --line: rgba(14,14,16,0.14);
  --card: #FFFFFF;
  --display: 'Archivo Black', system-ui, sans-serif;
  --sans: 'Space Grotesk', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--fg);
  -webkit-font-smoothing: antialiased;
  transition: background 0.25s ease, color 0.25s ease;
  overflow-x: hidden;
}

button { font-family: inherit; cursor: pointer; }
input { font-family: inherit; }

/* MARQUEE */
.marquee {
  width: 100%;
  overflow: hidden;
  border-bottom: 2px solid var(--fg);
  font-family: var(--display);
  font-size: 14px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--fg);
  padding: 10px 0;
}
.marquee-track {
  display: inline-flex;
  white-space: nowrap;
  animation: scroll 40s linear infinite;
  gap: 0;
}
.marquee-item { display: inline-flex; align-items: center; gap: 18px; padding-right: 18px; }
.marquee-dot { font-size: 10px; opacity: 0.6; }
@keyframes scroll { to { transform: translateX(-33.333%); } }

/* TOPBAR */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px clamp(20px, 4vw, 56px);
  border-bottom: 1px solid var(--line);
}
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 22px; letter-spacing: -0.01em; }
.logo-mark { color: var(--accent); font-size: 26px; text-shadow: 0 0 0 var(--fg); -webkit-text-stroke: 1.5px var(--fg); }
.logo-text { color: var(--fg); }
.logo-dot { color: var(--accent); -webkit-text-stroke: 1.5px var(--fg); }
.nav { display: flex; gap: 26px; align-items: center; font-size: 14px; font-weight: 500; }
.nav a { color: var(--fg); text-decoration: none; opacity: 0.7; transition: opacity 0.15s; }
.nav a:hover { opacity: 1; }
.nav-cta {
  background: var(--fg);
  color: var(--bg) !important;
  padding: 10px 16px;
  border-radius: 999px;
  opacity: 1 !important;
  font-weight: 600;
}
.nav-cta:hover { background: var(--accent); color: var(--fg) !important; }

/* HERO */
.hero {
  padding: clamp(40px, 7vw, 100px) clamp(20px, 4vw, 56px) 40px;
  max-width: 1200px;
}
.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--mono);
  font-size: 12px;
  text-transform: lowercase;
  color: var(--fg-soft);
  border: 1px solid var(--line);
  padding: 8px 14px;
  border-radius: 999px;
  margin-bottom: 28px;
}
.dot {
  width: 8px; height: 8px; background: var(--accent); border-radius: 50%;
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 30%, transparent);
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse { 50% { transform: scale(1.3); } }

.hero-title {
  font-family: var(--display);
  font-size: clamp(36px, 5.2vw, 72px);
  line-height: 0.95;
  margin: 0 0 22px;
  letter-spacing: -0.025em;
  text-wrap: balance;
}
.hero-title-fancy {
  display: inline-block;
  position: relative;
  height: 1em;
  vertical-align: top;
  min-width: 5ch;
}
.hero-title-fancy > span {
  position: absolute;
  inset: 0;
  font-family: serif;
  font-weight: 400;
  animation: cycle 4.5s infinite;
  opacity: 0;
  white-space: nowrap;
}
.fancy-1 { animation-delay: 0s !important; }
.fancy-2 { animation-delay: 1.5s !important; }
.fancy-3 { animation-delay: 3s !important; }
@keyframes cycle {
  0%, 28%, 100% { opacity: 0; transform: translateY(0.05em) skewX(-3deg); }
  4%, 30% { opacity: 1; transform: translateY(0) skewX(0); }
}

.hero-sub {
  font-size: clamp(14px, 1.2vw, 16px);
  max-width: 520px;
  line-height: 1.5;
  color: var(--fg-soft);
  margin: 0 0 28px;
}

.input-cue {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--mono);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--fg);
  margin-bottom: 10px;
  font-weight: 600;
}
.input-cue-arrow {
  display: inline-block;
  font-size: 20px;
  animation: bounce-down 1.2s ease-in-out infinite;
}
@keyframes bounce-down {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(5px); }
}

.input-wrap {
  position: relative;
  border: 2.5px solid var(--fg);
  background: var(--card);
  border-radius: 18px;
  padding: 22px 24px 26px;
  max-width: 720px;
  box-shadow: 8px 8px 0 var(--fg);
  transition: transform 0.15s, box-shadow 0.15s;
  animation: idle-glow 2.8s ease-in-out infinite;
}
@keyframes idle-glow {
  0%, 100% { box-shadow: 8px 8px 0 var(--fg); }
  50% { box-shadow: 8px 8px 0 var(--accent), 8px 8px 0 2.5px var(--fg); }
}
.input-wrap:focus-within {
  animation: none;
  transform: translate(-2px, -2px);
  box-shadow: 12px 12px 0 var(--accent), 12px 12px 0 2.5px var(--fg);
}
.input-label {
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--fg-soft);
  margin-bottom: 4px;
}
.big-input {
  width: 100%;
  font-family: var(--display);
  font-size: clamp(28px, 4.5vw, 48px);
  background: transparent;
  border: none;
  outline: none;
  color: var(--fg);
  padding: 0;
  letter-spacing: -0.02em;
}
.big-input::placeholder { color: var(--fg-soft); opacity: 0.4; }
.input-clear {
  position: absolute;
  right: 18px;
  bottom: 18px;
  background: transparent;
  border: 1px solid var(--line);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-family: var(--mono);
  color: var(--fg-soft);
}
.input-clear:hover { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.counter-row {
  display: flex;
  gap: clamp(20px, 4vw, 56px);
  margin-top: 36px;
  flex-wrap: wrap;
}
.counter-n {
  font-family: var(--display);
  font-size: clamp(28px, 4vw, 44px);
  line-height: 1;
}
.counter-l {
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--fg-soft);
  margin-top: 6px;
}

/* SUGGESTIONS */
.suggest-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  padding: 0 clamp(20px, 4vw, 56px) 50px;
}
.suggest-label {
  font-family: var(--mono);
  font-size: 12px;
  text-transform: uppercase;
  color: var(--fg-soft);
  margin-right: 6px;
}
.chip {
  background: transparent;
  border: 1px solid var(--line);
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 13px;
  color: var(--fg);
  transition: all 0.12s;
}
.chip:hover {
  background: var(--fg);
  color: var(--bg);
  border-color: var(--fg);
  transform: translateY(-1px);
}

/* RESULTS */
.results {
  padding: 0 clamp(20px, 4vw, 56px) 80px;
  border-top: 2px solid var(--fg);
  padding-top: 50px;
}
.results-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 28px;
  flex-wrap: wrap;
  gap: 10px;
}
.results-title {
  font-family: var(--display);
  font-size: clamp(32px, 5vw, 56px);
  margin: 0;
  letter-spacing: -0.02em;
}
.results-meta {
  font-family: var(--mono);
  font-size: 12px;
  text-transform: uppercase;
  color: var(--fg-soft);
}

.cards {
  display: grid;
  gap: 14px;
}
.results-grid .cards { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.results-mosaic .cards { grid-template-columns: repeat(12, 1fr); grid-auto-rows: minmax(120px, auto); }
.results-list .cards { grid-template-columns: 1fr; }

.card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 14px;
  text-align: left;
  background: var(--card);
  border: 1.5px solid var(--fg);
  border-radius: 14px;
  padding: 16px 18px;
  color: var(--fg);
  font: inherit;
  cursor: pointer;
  transition: all 0.15s;
  overflow: hidden;
  min-height: 110px;
}
.card:hover {
  transform: translate(-2px, -2px);
  box-shadow: 4px 4px 0 var(--accent), 4px 4px 0 1.5px var(--fg);
}
.card:active { transform: translate(0, 0); box-shadow: none; }
.card.copied {
  background: var(--accent);
  border-color: var(--fg);
}
.card.copied .card-status { color: var(--fg); font-weight: 700; }

.card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--fg-soft);
}
.card-num { font-weight: 600; color: var(--fg); }
.card-name { flex: 1; }
.card-status { opacity: 0.55; transition: opacity 0.15s; }
.card:hover .card-status { opacity: 1; }

.card-value {
  font-size: clamp(20px, 2.2vw, 30px);
  font-family: serif;
  line-height: 1.15;
  word-break: break-word;
  overflow-wrap: anywhere;
  letter-spacing: -0.005em;
}

/* Mosaic — feature a few cards bigger */
.results-mosaic .card { grid-column: span 4; }
.results-mosaic .card:nth-child(7n+1) { grid-column: span 6; }
.results-mosaic .card:nth-child(7n+4) { grid-column: span 8; }
.results-mosaic .card:nth-child(7n+6) { grid-column: span 6; }
@media (max-width: 900px) {
  .results-mosaic .cards { grid-template-columns: repeat(2, 1fr); }
  .results-mosaic .card,
  .results-mosaic .card:nth-child(n) { grid-column: span 1; }
}

.results-list .card { flex-direction: row; align-items: center; min-height: 60px; padding: 14px 20px; }
.results-list .card-head { flex-direction: row; min-width: 200px; max-width: 200px; }
.results-list .card-value { flex: 1; font-size: clamp(18px, 1.8vw, 24px); }

/* FAQ */
.faq {
  padding: 60px clamp(20px, 4vw, 56px);
  border-top: 2px solid var(--fg);
  background: color-mix(in oklab, var(--fg) 4%, var(--bg));
}
.faq-title {
  font-family: var(--display);
  font-size: clamp(28px, 4vw, 44px);
  margin: 0 0 30px;
  letter-spacing: -0.02em;
}
.faq-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 24px;
}
.faq-q {
  font-family: var(--display);
  font-size: 17px;
  margin-bottom: 6px;
}
.faq-a { color: var(--fg-soft); line-height: 1.5; font-size: 14.5px; }

/* FOOTER */
.footer {
  padding: 60px clamp(20px, 4vw, 56px) 30px;
  border-top: 2px solid var(--fg);
  overflow: hidden;
}
.footer-big {
  font-family: var(--display);
  font-size: clamp(70px, 16vw, 240px);
  line-height: 1;
  letter-spacing: -0.04em;
  margin-bottom: 20px;
  user-select: none;
}
.footer-row {
  display: flex;
  gap: 14px;
  align-items: center;
  font-family: var(--mono);
  font-size: 12px;
  text-transform: uppercase;
  color: var(--fg-soft);
  flex-wrap: wrap;
}
.footer-dot { font-size: 8px; opacity: 0.5; }

/* TOAST */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--fg);
  color: var(--bg);
  padding: 12px 20px;
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.02em;
  z-index: 100;
  animation: toastIn 0.2s ease-out;
  box-shadow: 0 8px 24px rgba(0,0,0,0.18);
}
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } }

@media (max-width: 640px) {
  .nav a:not(.nav-cta) { display: none; }
  .results-list .card { flex-direction: column; align-items: flex-start; }
  .results-list .card-head { max-width: none; min-width: 0; width: 100%; }
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script src="fancy-text.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
